name: E2E Tests (Playwright)

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test-e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('**/Dockerfile*') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Create required directories
        run: |
          mkdir -p frontend/playwright-report
          mkdir -p frontend/test-results
          chmod -R 777 frontend/playwright-report frontend/test-results

      # ✅ Utiliser le fichier .env.e2e.ci pour GitHub Actions
      - name: Setup CI environment
        run: |
          echo "🤖 Configuration pour GitHub Actions"
          cp .env.e2e.ci .env

      - name: Build Docker images
        run: |
          echo "🏗️ Building Docker images..."
          docker compose -f docker-compose.e2e.yml --env-file .env.e2e.ci build --build-arg BUILDKIT_INLINE_CACHE=1
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          BUILDX_CACHE_FROM: type=local,src=/tmp/.buildx-cache
          BUILDX_CACHE_TO: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

      - name: Start E2E environment
        run: |
          echo "🚀 Starting all services with CI configuration..."
          docker compose -f docker-compose.e2e.yml --env-file .env.e2e.ci up -d
          echo "Services started!"

      - name: Wait for services to be healthy
        run: |
          echo "⏳ Waiting for services to be healthy..."

          # Attendre PostgreSQL
          timeout 60 bash -c 'until docker compose -f docker-compose.e2e.yml exec -T postgres pg_isready -U sylius -d sylius_e2e; do echo "Waiting for PostgreSQL..."; sleep 2; done'
          echo "✅ PostgreSQL is ready"

          # Attendre Mailpit
          timeout 60 bash -c 'until curl -f http://localhost:8025/api/v1/info; do echo "Waiting for Mailpit..."; sleep 2; done'
          echo "✅ Mailpit is ready"

          # Vérifier que PHP-FPM est démarré
          echo "⏳ Checking PHP-FPM initialization status..."
          docker compose -f docker-compose.e2e.yml logs php --tail=50

          # Suivre les logs PHP en temps réel en arrière-plan
          echo "⏳ Following PHP-FPM logs (fixtures loading may take 3-5 minutes on GitHub Actions)..."
          docker compose -f docker-compose.e2e.yml logs -f --tail=20 php &
          PHP_LOGS_PID=$!

          # Attendre Sylius API avec timeout augmenté pour GitHub Actions
          # Note: Les fixtures minimales prennent 2-4 minutes sur GitHub Actions (runners partagés)
          echo "⏳ Waiting for Sylius API (timeout: 10 minutes)..."
          timeout 600 bash -c 'until curl -f http://localhost:8000/api/v2/shop/products 2>/dev/null; do
            echo "Still waiting for Sylius... (checking every 15s)"
            sleep 15
          done' || {
            echo "❌ Timeout waiting for Sylius API after 10 minutes"
            echo "🔍 Last 100 lines of PHP logs:"
            docker compose -f docker-compose.e2e.yml logs php --tail=100
            echo "🔍 Nginx logs:"
            docker compose -f docker-compose.e2e.yml logs sylius --tail=50
            exit 1
          }

          # Arrêter le suivi des logs
          kill $PHP_LOGS_PID 2>/dev/null || true

          echo "✅ Sylius API is ready"

          # Attendre que Nuxt soit healthy (utilise le healthcheck Docker)
          echo "⏳ Waiting for Nuxt to be healthy..."
          timeout 120 bash -c 'while [ "$(docker inspect -f {{.State.Health.Status}} nuxt-frontend-e2e 2>/dev/null || echo "starting")" != "healthy" ]; do
            echo "Nuxt status: $(docker inspect -f {{.State.Health.Status}} nuxt-frontend-e2e 2>/dev/null || echo "not ready")"
            sleep 5
          done' || {
            echo "❌ Timeout: Nuxt did not become healthy"
            echo "🔍 Nuxt logs:"
            docker compose -f docker-compose.e2e.yml logs nuxt --tail=100
            exit 1
          }
          echo "✅ Nuxt is ready"

          echo "🎉 All services are healthy!"

      - name: Display services status
        run: |
          echo "📊 Services status:"
          docker compose -f docker-compose.e2e.yml ps

      - name: Display services URLs
        run: |
          echo "🌐 Services available at:"
          echo "  📱 Frontend Nuxt   : http://localhost:3000"
          echo "  🔧 Backend Sylius  : http://localhost:8000"
          echo "  📧 Mailpit UI      : http://localhost:8025"

      - name: Build Sylius assets
        run: |
          echo "🎨 Building Sylius frontend assets..."

          # Install Node.js dependencies and build assets in Sylius container
          # Note: Using npm (not yarn) to match Dockerfile.e2e configuration
          # Note: Using sh (not bash) because Alpine Linux base image doesn't have bash
          docker compose -f docker-compose.e2e.yml exec -T php sh -c "
            cd /srv/sylius && \
            npm install --no-progress --legacy-peer-deps && \
            npm run build:prod && \
            php bin/console cache:clear
          " || {
            echo "❌ Failed to build Sylius assets"
            echo "🔍 Checking Sylius container logs:"
            docker compose -f docker-compose.e2e.yml logs php --tail=50
            exit 1
          }

          echo "✅ Sylius assets built successfully"

      - name: Run Playwright E2E tests (Smoke tests - Firefox browser)
        run: |
          echo "🎭 Running Playwright smoke tests on Firefox..."
          docker compose -f docker-compose.e2e.yml --profile test-firefox up --exit-code-from playwright-firefox playwright-firefox

      - name: Copy test artifacts from container
        if: always()
        run: |
          echo "📦 Copying test artifacts..."

          # Créer les dossiers si nécessaire
          mkdir -p frontend/playwright-report frontend/test-results

          # Copier les rapports depuis le container (si le container existe encore)
          docker cp playwright-firefox-e2e:/app/playwright-report/. frontend/playwright-report/ 2>/dev/null || echo "⚠️ No playwright-report found"
          docker cp playwright-firefox-e2e:/app/test-results/. frontend/test-results/ 2>/dev/null || echo "⚠️ No test-results found"

          # Afficher ce qui a été copié
          echo "📁 Artifacts copied:"
          ls -la frontend/playwright-report/ || echo "No playwright-report"
          ls -la frontend/test-results/ || echo "No test-results"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Display logs on failure
        if: failure()
        run: |
          echo "🔍 Displaying logs for debugging..."
          echo "=== Sylius logs ==="
          docker compose -f docker-compose.e2e.yml logs sylius --tail=100
          echo "=== Nuxt logs ==="
          docker compose -f docker-compose.e2e.yml logs nuxt --tail=100
          echo "=== Playwright logs ==="
          docker compose -f docker-compose.e2e.yml logs playwright-firefox --tail=200

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          docker compose -f docker-compose.e2e.yml down -v
          echo "✅ Cleanup complete"