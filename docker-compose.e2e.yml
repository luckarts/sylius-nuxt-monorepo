services:
  # Mailpit - Serveur SMTP de test pour intercepter les emails
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-e2e
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI (SMTP 1025 reste interne au réseau Docker)
    networks:
      - sylius-e2e-network
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      TZ: Europe/Paris
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Base de données PostgreSQL pour Sylius
  postgres:
    image: postgres:15-alpine
    container_name: sylius-postgres-e2e
    environment:
      POSTGRES_DB: sylius_e2e
      POSTGRES_USER: sylius
      POSTGRES_PASSWORD: sylius_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    networks:
      - sylius-e2e-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sylius -d sylius_e2e && psql -U sylius -d sylius_e2e -c 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Backend Sylius PHP-FPM (optimisé pour CI/CD)
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile.e2e  # Utilise le Dockerfile optimisé pour E2E
      args:
        APP_ENV: test
    container_name: sylius-php-e2e
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: test-secret-key-for-e2e
      DATABASE_URL: "postgresql://sylius:sylius_password@postgres:5432/sylius_e2e?serverVersion=15&charset=utf8"
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: "e2e-test-passphrase"
      MAILER_DSN: "smtp://mailpit:1025"
      MESSENGER_TRANSPORT_DSN: "doctrine://default"
      CORS_ALLOW_ORIGIN: "^http://localhost:3000$$"
      # ROUTER_DEFAULT_URI doit pointer vers nginx-proxy pour que les containers Docker puissent communiquer
      # Sur CI/GitHub Actions, les containers ne peuvent pas accéder à "localhost"
      ROUTER_DEFAULT_URI: "http://nginx-proxy"  # ✅ Utiliser nginx-proxy pour les redirections internes
      SYLIUS_FIXTURES_HOSTNAME: "localhost"  # Hostname du channel pour les API calls (sans port)
      TRUSTED_HOSTS: "^(localhost|sylius|nginx-proxy|127\\.0\\.0\\.1)$"  # ✅ Ajouter nginx-proxy aux hosts de confiance
    volumes:
      - ./backend:/srv/sylius
      - sylius_var:/srv/sylius/var
      - sylius_vendor:/srv/sylius/vendor
    networks:
      - sylius-e2e-network

  # Nginx pour servir Sylius
  sylius:
    image: ghcr.io/sylius/sylius-nginx:latest
    container_name: sylius-nginx-e2e
    depends_on:
      - php
    ports:
      - "8000:80"
    volumes:
      - ./backend:/srv/sylius:ro
    networks:
      - sylius-e2e-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/api/v2/shop/products || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 240s  # 4 minutes to allow PHP-FPM to fully load fixtures

  # Reverse Proxy Nginx (pour forcer Host: localhost)
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy-e2e
    depends_on:
      - sylius
    ports:
      - "9000:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sylius-e2e-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend Nuxt 3
  nuxt:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    container_name: nuxt-frontend-e2e
    # Note: user: "1000:1000" retiré pour compatibilité GitHub Actions (problèmes de permissions)
    # Pour le développement local, utilisez docker-compose.e2e.local.yml
    depends_on:
      - nginx-proxy
    environment:
      NUXT_PUBLIC_API_BASE: "http://nginx-proxy"
      SYLIUS_API_URL: "http://nginx-proxy"  # Pour le proxy API côté serveur
      SYLIUS_CHANNEL_CODE: "WEB"
      NUXT_API_SECRET: "test-secret"
      AUTH_SECRET: "test-auth-secret"
      NODE_ENV: "test"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - nuxt_node_modules:/app/node_modules
      - nuxt_nuxt:/app/.nuxt  # Volume pour .nuxt pour éviter les conflits
      - nuxt_output:/app/.output
    networks:
      - sylius-e2e-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 120s  # 2 min pour pnpm install + build + démarrage sur GitHub Actions
  # Playwright (pour lancer les tests - tous les navigateurs)
  # Note: Using 'latest' because specific version tags may not be available immediately on Docker Hub
  playwright:
    image: mcr.microsoft.com/playwright:latest
    container_name: playwright-e2e
    depends_on:
      nuxt:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      BASE_URL: "http://nuxt:3000"
      MAILPIT_URL: "http://mailpit:8025"
      CI: "true"
    volumes:
      - ./frontend:/app
      # Pas de volume pour node_modules - Playwright réinstalle tout à chaque run
    working_dir: /app
    networks:
      - sylius-e2e-network
    command: >
      sh -c "
        npm install -g pnpm &&
        rm -rf node_modules/.cache &&
        pnpm install --no-frozen-lockfile &&
        pnpm exec playwright install --with-deps &&
        pnpm exec playwright test
      "
    profiles:
      - test

  # Playwright - Chromium uniquement
  playwright-chrome:
    image: mcr.microsoft.com/playwright:latest
    container_name: playwright-chrome-e2e
    depends_on:
      nuxt:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      BASE_URL: "http://nuxt:3000"
      MAILPIT_URL: "http://mailpit:8025"
      CI: "true"
    volumes:
      - ./frontend:/app
      # Pas de volume pour node_modules - Playwright réinstalle tout à chaque run
    working_dir: /app
    networks:
      - sylius-e2e-network
    command: >
      sh -c "
        npm install &&
        npx playwright install --with-deps chromium &&
        npx playwright test --project=chromium
      "
    profiles:
      - test-chrome

  # Playwright - Firefox uniquement
  playwright-firefox:
    image: mcr.microsoft.com/playwright:latest
    container_name: playwright-firefox-e2e
    depends_on:
      nuxt:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      BASE_URL: "http://nuxt:3000"
      MAILPIT_URL: "http://mailpit:8025"
      CI: "true"
      POSTGRES_DB: "sylius_e2e"
      POSTGRES_USER: "sylius"
      POSTGRES_PASSWORD: "sylius_password"
    volumes:
      - ./frontend:/app
      # Pas de volume pour node_modules - Playwright réinstalle tout à chaque run
    working_dir: /app
    networks:
      - sylius-e2e-network
    command: >
      sh -c "
        npm install &&
        npx playwright install --with-deps firefox &&
        npx playwright test --project=firefox
      "
    profiles:
      - test-firefox

  # Playwright - WebKit uniquement
  playwright-webkit:
    image: mcr.microsoft.com/playwright:latest
    container_name: playwright-webkit-e2e
    depends_on:
      nuxt:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      BASE_URL: "http://nuxt:3000"
      MAILPIT_URL: "http://mailpit:8025"
      CI: "true"
    volumes:
      - ./frontend:/app
      # Pas de volume pour node_modules - Playwright réinstalle tout à chaque run
    working_dir: /app
    networks:
      - sylius-e2e-network
    command: >
      sh -c "
        npm install &&
        npx playwright install --with-deps webkit &&
        npx playwright test --project=webkit
      "
    profiles:
      - test-webkit

volumes:
  mailpit_data:
    driver: local
  postgres_e2e_data:
    driver: local
  sylius_var:
    driver: local
  sylius_vendor:
    driver: local
  nuxt_node_modules:
    driver: local
  nuxt_nuxt:
    driver: local
  nuxt_output:
    driver: local
  # playwright_node_modules retiré - Playwright réinstalle tout à chaque run

networks:
  sylius-e2e-network:
    driver: bridge