# Configuration du reverse proxy Nginx pour E2E
# Ce proxy force le header Host: localhost pour tous les appels à Sylius

upstream sylius_backend {
    server sylius:80;
}

server {
    listen 80;
    server_name _;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Proxy vers Sylius avec Host: localhost
    location / {
        proxy_pass http://sylius_backend;

        # Force le header Host à "localhost"
        proxy_set_header Host localhost;

        # Headers classiques pour le proxy
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
